aid: dlthub
name: dltHub
description: >-
  dltHub is the company behind dlt (data load tool), the open-source, Python-first
  data-loading library that moves data from any source to any destination with
  automatic schema inference, nested-JSON normalization, incremental loads, and
  evolving types. On top of the Apache-2.0 library, dltHub ships dlt+ (a commercial
  framework for productionising pipelines in teams and at scale, with Iceberg and
  AI workflows) and an agentic platform that deploys, monitors, and scales dlt
  pipelines. The developer surface is code-first: PyPI packages (dlt, dlt-plus),
  a rich CLI (dlt init/pipeline/schema/deploy), a first-party MCP server for
  agentic coding tools, and extensive documentation, tutorials, and a Slack
  community. dltHub is backed by Bessemer Venture Partners and operates as
  ScaleVector GmbH.
